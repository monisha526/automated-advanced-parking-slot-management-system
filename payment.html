<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>genpark</title>
  <style>
    .logo-container {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }
    .logo-container a {
      display: block;
      text-decoration: none;
    }
    .logo-container img {
      height: 50px;
      width: auto;
      border-radius: 5px;
      transition: transform 0.3s ease;
    }
    .logo-container a:hover img {
      transform: scale(1.05);
    }
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: darkblue; }
    .panel { border: 1px solid #ccc; padding: 15px; background: #f9f9f9; margin-top: 15px; }
    form input, form select, form button { margin-bottom: 10px; width: 250px; padding: 8px; }
    button { background: blue; color: white; padding: 8px 12px; border: none; cursor: pointer; margin-right: 5px; }
    button:hover { background: darkblue; }
    .qr-container { 
      margin-top: 20px; 
      text-align: center; 
      padding: 15px; 
      background: white; 
      border: 1px solid #ddd; 
      border-radius: 5px;
      display: none;
    }
    .qr-container.visible { display: block; }
    #paymentQR { max-width: 300px; margin: 15px auto; }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <div class="logo-container">
    <a href="main.html" title="GenPark Home">
      <img src="logopg.jpeg" alt="GenPark Logo">
    </a>
  </div>
  <parking class="js"></parking>
  <h1>🚗 Smart Parking Finder - Payment</h1>
  <div style="text-align: right; margin-bottom: 15px;">
    <a href="ai-chat.html" style="background: #667eea; color: white; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-weight: bold;">💬 Chat Support</a>
  </div>
  <div class="panel">
    <h2>Your Booking Summary</h2>
    <p><strong>Lot:</strong> <span id="paymentLotName"></span></p>
    <p id="slotNumberDisplay"></p>
    <p id="parkingDateDisplay"></p>
    <p id="parkingTimeDisplay"></p>
    <p><strong>Amount:</strong> ₹<span id="paymentAmount"></span></p>
  </div>
  <div class="panel">
    <h2>Pay Online</h2>
    <label for="paymentGateway">Choose Payment Method:</label><br>
    <select id="paymentGateway" onchange="updatePaymentFields()">
      <option value="razorpay">Razorpay (UPI/Card)</option>
      <option value="paytm">Paytm (Wallet/UPI)</option>
      <option value="stripe">Stripe (Card)</option>
      <option value="gpay">Google Pay (UPI)</option>
      <option value="phonepe">PhonePe (UPI/Wallet)</option>
      <option value="netbanking">Net Banking</option>
    </select><br>
    <div id="paymentFields">
      <label for="payerName">Name on payment:</label><br>
      <input type="text" id="payerName" placeholder="Your name"><br>
      <label for="payerEmail">Email:</label><br>
      <input type="email" id="payerEmail" placeholder="you@example.com"><br>
      <label for="cardNumber">Card number:</label><br>
      <input type="text" id="cardNumber" placeholder="0000 0000 0000 0000"><br>
    </div>
    
    <!-- QR Code Section -->
    <div class="qr-container" id="qrContainer">
      <h3>Scan to Pay</h3>
      <div id="paymentQR"></div>
      <p id="paymentQRText">Scan this QR code to complete payment</p>
    </div>
    
    <button type="button" onclick="generatePaymentQR()">Generate QR Code</button>
    <button type="button" onclick="payOnline()">Pay Now</button>
    <button type="button" onclick="goBack()">Back</button>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    updatePaymentFields();
    
    // Generate QR Code for Payment
    function generatePaymentQR() {
      const payerName = document.getElementById("payerName").value;
      const payerEmail = document.getElementById("payerEmail").value;
      const paymentGateway = document.getElementById("paymentGateway").value;
      const amount = document.getElementById("paymentAmount").textContent;
      
      if (!payerName || !payerEmail) {
        alert("Please enter name and email first");
        return;
      }
      
      // Create payment string for QR code
      const paymentString = `Name:${payerName}|Email:${payerEmail}|Gateway:${paymentGateway}|Amount:${amount}`;
      
      // Clear previous QR code
      const qrDiv = document.getElementById("paymentQR");
      qrDiv.innerHTML = "";
      
      // Generate new QR code
      new QRCode(qrDiv, {
        text: paymentString,
        width: 250,
        height: 250,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      
      // Show QR container
      document.getElementById("qrContainer").classList.add("visible");
      console.log("QR Code generated for:", paymentString);
    }
  </script>
  <script>
    function updatePaymentFields() {
      // keep this if you already have logic to show/hide fields
    }

    function goBack() {
      window.history.back();
    }

    function payOnline() {
      const payerName = document.getElementById("payerName").value;
      const payerEmail = document.getElementById("payerEmail").value;
      const amount = document.getElementById("paymentAmount").textContent;
      const lotName = document.getElementById("paymentLotName").textContent;

      if (!payerName || !payerEmail) {
        alert("Please enter name and email first");
        return;
      }

      const confirmationData = {
        lotName,
        amount,
        payerName,
        payerEmail,
        bookedAt: new Date().toISOString()
      };
      
      // Keep slot selection data in localStorage for confirmation page
      localStorage.setItem("parkingConfirmation", JSON.stringify(confirmationData));

      // redirect to confirmation page
      window.location.href = "confirmation.html";
    }
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('parkingPayment');
      const slotData = localStorage.getItem('parkingSlotSelection');
      
      if (!saved) {
        alert('No parking slot selected.');
        return;
      }

      const data = JSON.parse(saved);
      document.getElementById('paymentLotName').textContent = data.lotName;
      document.getElementById('paymentAmount').textContent = data.amount;

      // Display slot details if available
      if (slotData) {
        const slot = JSON.parse(slotData);
        
        const slotDisplay = document.getElementById('slotNumberDisplay');
        const dateDisplay = document.getElementById('parkingDateDisplay');
        const timeDisplay = document.getElementById('parkingTimeDisplay');

        if (slotDisplay && slot.selectedSlot) {
          slotDisplay.innerHTML = `<strong>Selected Slot:</strong> ${slot.selectedSlot}`;
        }

        if (dateDisplay && slot.parkingDate) {
          const dateObj = new Date(slot.parkingDate);
          const formattedDate = dateObj.toLocaleDateString('en-US', {
            weekday: 'short',
            year: 'numeric',
            month: 'short',
            day: 'numeric'
          });
          dateDisplay.innerHTML = `<strong>Parking Date:</strong> ${formattedDate}`;
        }

        if (timeDisplay && slot.parkingTime) {
          timeDisplay.innerHTML = `<strong>From Time:</strong> ${slot.parkingTime}`;
        }
      }
    });
  </script>
  <!-- AI Chat Widget -->
  <script src="ai-chat.js"></script>
</body>
</html>
