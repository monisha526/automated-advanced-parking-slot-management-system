<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>genpark</title>
  <style>
    .logo-container {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }
    .logo-container a {
      display: block;
      text-decoration: none;
    }
    .logo-container img {
      height: 50px;
      width: auto;
      border-radius: 5px;
      transition: transform 0.3s ease;
    }
    .logo-container a:hover img {
      transform: scale(1.05);
    }
    body { font-family: Arial, sans-serif; margin: 20px; background: #f9f9f9; }
    h1 { color: darkblue; text-align: center; }
    .section { margin-bottom: 30px; background: white; padding: 15px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .parking-lot { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; background: white; border-radius: 5px; }
    .parking-lot:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    .available { color: green; font-weight: bold; }
    .book-btn { background: #4facfe; color: white; padding: 8px 12px; border: none; cursor: pointer; border-radius: 3px; }
    .book-btn:hover { background: #0080ff; }
    .book-btn:disabled { background: gray; cursor: not-allowed; }
    form input, form select, form button { margin-bottom: 10px; width: 250px; padding: 8px; border: 1px solid #ddd; border-radius: 3px; }
    form button { background: #4facfe; color: white; border: none; cursor: pointer; }
    form button:hover { background: #0080ff; }
    .panel { border: 1px solid #ddd; padding: 15px; background: #f9f9f9; margin-top: 15px; border-radius: 5px; }
    .panel.hidden { display: none; }
    .qr-code { width: 220px; height: 220px; border: 1px solid #ccc; margin-top: 15px; }
    .confirmation { background: #e8f5e9; border-color: #81c784; }
    .button-group button { margin-right: 10px; }
    #map { 
      height: 500px; 
      width: 100%; 
      margin-top: 15px; 
      border-radius: 5px; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border: 1px solid #ddd;
    }
    .login-form { max-width: 300px; margin: 0 auto; }
    .notification { background: #fff3cd; border: 1px solid #ffeaa7; padding: 10px; margin-bottom: 15px; border-radius: 3px; }
    .notification.hidden { display: none; }
    .parking-slot { 
      width: 60px; 
      height: 60px; 
      border: 2px solid #333; 
      border-radius: 5px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-weight: bold; 
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .parking-slot:hover { 
      transform: scale(1.1);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }
    .slot-available { 
      background-color: #4caf50; 
      color: white; 
      border-color: #2e7d32;
    }
    .slot-occupied { 
      background-color: #f44336; 
      color: white; 
      border-color: #c62828;
    }
    .slot-reserved { 
      background-color: #ff9800; 
      color: white; 
      border-color: #e65100;
    }
    .location-btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 10px 16px;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      transition: all 0.3s ease;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .location-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      background: linear-gradient(135deg, #764ba2 0%, #667eea 100%);
    }
    .location-btn:active {
      transform: translateY(0);
    }
  </style>
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-auth.js"></script>
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Google Maps API -->
  <script src="https://maps.googleapis.com/maps/api/js?key=YOUR_GOOGLE_MAPS_API_KEY"></script>
</head>
<body>
  <div class="logo-container">
    <a href="main.html" title="GenPark Home">
      <img src="logopg.jpeg" alt="GenPark Logo">
    </a>
  </div>
  <h1>🚗 Smart Parking Finder</h1>
  
  <!-- AI Chat Link -->
  <div style="text-align: right; padding: 10px 20px; margin-bottom: 10px;">
    <a href="ai-chat.html" style="background: #667eea; color: white; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-weight: bold;">💬 Chat Support</a>
  </div>

  <div id="notification" class="notification hidden"></div>

  <div class="section">
    <h2>User Login/Signup</h2>
    <div id="loginPanel" class="login-form">
      <label for="username">Username:</label><br>
      <input type="text" id="username"><br>
      <label for="password">Password:</label><br>
      <input type="password" id="password"><br>
      <button type="button" onclick="loginUser()">Login</button>
      <button type="button" onclick="signupUser()">Signup</button>
    </div>
    <p id="userStatus">Not logged in</p>
  </div>

  <div class="section">
    <h2>Find Nearby Parking</h2>
    <label for="searchInput">Search by location:</label><br>
    <input type="text" id="searchInput" placeholder="Enter location or landmark"><br>
    <button type="button" onclick="searchParking()">Search</button>
    <button type="button" onclick="resetSearch()">Show All</button>
    <button type="button" onclick="getCurrentLocation()">Use My Location</button>
    
    <div style="margin-top: 15px; margin-bottom: 15px;">
      <p><strong>Quick Search by Location:</strong></p>
      <div id="locationFilters" style="display: flex; flex-wrap: wrap; gap: 8px;">
        <button type="button" class="location-btn" onclick="filterByLocation('Beach')">🏖️ Beach</button>
        <button type="button" class="location-btn" onclick="filterByLocation('Mall')">🛍️ Mall</button>
        <button type="button" class="location-btn" onclick="filterByLocation('Temple')">🕉️ Temple</button>
        <button type="button" class="location-btn" onclick="filterByLocation('Station')">🚂 Station</button>
        <button type="button" class="location-btn" onclick="filterByLocation('Hospital')">🏥 Hospital</button>
        <button type="button" class="location-btn" onclick="filterByLocation('Market')">🏪 Market</button>
        <button type="button" class="location-btn" onclick="filterByLocation('Park')">🌳 Park</button>
        <button type="button" class="location-btn" onclick="filterByLocation('School')">🎓 School</button>
      </div>
    </div>
  <div class="section">
    <h2>🅿️ Parking Lots</h2>
    <script>
    let parkingLots = [
      {name: "City Center Parking", location: "Downtown", slots: 15},
      {name: "Airport Parking", location: "Airport Road", slots: 10},
      {name: "Beachside Parking", location: "Beach", slots: 13},
      {name: "Mall Parking", location: "Mall", slots: 12},
      {name: "Temple Parking", location: "Temple", slots: 14},
      {name: "Station Parking", location: "Station", slots: 11},
      {name: "Hospital Parking", location: "Hospital", slots: 10},
      {name: "Market Parking", location: "Market", slots: 16},
      {name: "Park Parking", location: "Park", slots: 22},
      {name: "School Parking", location: "School", slots: 15}
    ];
    </script>
    <div id="parkingList"></div>  
    <script>
      renderParkingLots();
    function renderParkingLots() {
      let list = document.getElementById("parkingList");
      list.innerHTML = "";
      parkingLots.forEach((lot, index) => {
        list.innerHTML += `
          <div class="parking-lot">
            <h3>${lot.name}</h3>
            <p>Location: ${lot.location}</p>
            <p>Slots Available: <span class="available">${lot.slots}</span></p>
            <button class="book-btn" ${lot.slots === 0 ? "disabled" : ""}
              onclick="bookSlot(${index})">Pre-book Slot</button>
          </div>
        `;
      });
    } 
    function bookSlot(index) {
      const lot = parkingLots[index];
      if (lot.slots > 0) {
        lot.slots -= 1;

        const prepaidAmount = 100;
        const paymentData = {
          lotName: lot.name,
          amount: prepaidAmount,
          ownerShare: prepaidAmount * 0.5,
          platformShare: prepaidAmount * 0.5
        };

        localStorage.setItem('parkingPayment', JSON.stringify(paymentData));
        window.location.href = 'payment.html';
      }
    }     
    function registerLot() {
      let name = document.getElementById("lotName").value;
      let location = document.getElementById("lotLocation").value;
      let slots = parseInt(document.getElementById("lotSlots").value);
      if(name && location && slots > 0){
        parkingLots.push({name, location, slots});
        renderParkingLots();
        alert("Parking lot registered successfully!");
        document.getElementById("registerForm").reset();
      } else {
        alert("Please fill all fields with valid data.");
      }
    }
    </script>
    <!-- AI Chat Widget -->
    <script src="ai-chat.js"></script>
  </body>
</html>
  <div class="section">
    <h2>Register Your Parking Lot</h2>
    <form id="registerForm">
      <label>Parking Lot Name:</label>
      <input type="text" id="lotName"><br>
      <label>Location:</label>
      <input type="text" id="lotLocation"><br>
      <label>Total Slots:</label>
      <input type="number" id="lotSlots"><br>
      <button type="button" onclick="registerLot()">
        Register</button>
    </form> 
     </div>
