<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>genpark</title>
  <style>
    .logo-container {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }
    .logo-container a {
      display: block;
      text-decoration: none;
    }
    .logo-container img {
      height: 50px;
      width: auto;
      border-radius: 5px;
      transition: transform 0.3s ease;
    }
    .logo-container a:hover img {
      transform: scale(1.05);
    }
    body { font-family: Arial, sans-serif; margin: 20px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
    h1 { color: darkblue; }
    .panel { border: 1px solid #ccc; padding: 15px; background: #e8f5e9; margin-top: 15px; border-radius: 5px; }
    .qr-section { text-align: center; margin-top: 20px; padding: 15px; background: white; border-radius: 5px; }
    #qrCanvas { max-width: 250px; margin-top: 15px; }
    button { background: blue; color: white; padding: 8px 12px; border: none; cursor: pointer; border-radius: 3px; margin-right: 5px; }
    button:hover { background: darkblue; }
  </style>
</head>
<body>
  <div class="logo-container">
    <a href="main.html" title="GenPark Home">
      <img src="logopg.jpeg" alt="GenPark Logo">
    </a>
  </div>
  <h1>🚗 Smart Parking Finder - Confirmation</h1>
  <div style="text-align: right; margin-bottom: 15px;">
    <a href="ai-chat.html" style="background: #667eea; color: white; padding: 10px 15px; border-radius: 5px; text-decoration: none; font-weight: bold;">💬 Chat Support</a>
  </div>
  <div class="panel">
    <h2>✓ Booking Confirmed</h2>
    <p id="confirmationText"></p>
    
    <div class="qr-section">
      <h3>Parking Entry QR Code</h3>
      <div id="qrCanvas"></div>
      <p><strong>Show this QR code when you arrive at the parking lot</strong></p>
    </div>
    
    <button type="button" onclick="downloadConfirmation()">Download Confirmation</button>
    <button type="button" onclick="printConfirmation()">Print Confirmation</button>
    <button type="button" onclick="exitParking()" style="background: #ff9800; margin: 5px;">Exit Parking</button>
    <button type="button" onclick="goHome()">Book Another Slot</button>
  </div>
  
  <!-- QR Code Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <!-- Firebase Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.0.0/firebase-firestore.js"></script>
  
  <script>
    // Firebase Configuration
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
  </script>
  
  <script src="parking.js"></script>
  <script>
    // Helper functions for confirmation page
    function downloadConfirmation() {
      const confirmText = document.getElementById("confirmationText").innerText;
      const element = document.createElement("a");
      element.setAttribute("href", "data:text/plain;charset=utf-8," + encodeURIComponent(confirmText));
      element.setAttribute("download", "parking-confirmation.txt");
      element.style.display = "none";
      document.body.appendChild(element);
      element.click();
      document.body.removeChild(element);
      alert("Confirmation downloaded!");
    }
    
    function printConfirmation() {
      window.print();
    }
    
    function exitParking() {
      // Get booking ID from localStorage
      const bookingId = localStorage.getItem('lastBookingId');
      const slotData = localStorage.getItem('parkingSlotSelection');
      
      if (bookingId && slotData) {
        const slot = JSON.parse(slotData);
        window.location.href = `slot-exit.html?bookingId=${bookingId}&slot=${slot.selectedSlot}&date=${slot.parkingDate}&time=${slot.parkingTime}`;
      } else {
        alert('Booking information not found. Please try again.');
      }
    }

    function goHome() {
      // Clear booking data and go back to main page
      localStorage.removeItem('parkingConfirmation');
      localStorage.removeItem('parkingPayment');
      localStorage.removeItem('parkingSlotSelection');
      localStorage.removeItem('selectedLotIndex');
      window.location.href = 'main.html';
    }
  </script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("parkingConfirmation");
      const slotData = localStorage.getItem("parkingSlotSelection");
      
      if (!saved) {
        document.getElementById("confirmationText").textContent =
          "No booking data found. Please complete payment first.";
        return;
      }

      // Generate unique booking ID
      const bookingId = 'BK' + Date.now() + Math.random().toString(36).substr(2, 9).toUpperCase();
      localStorage.setItem('lastBookingId', bookingId);

      const data = JSON.parse(saved);
      let confirmText = `Your slot at ${data.lotName} is confirmed. Amount paid: ₹${data.amount}. ` +
        `Paid by ${data.payerName} (${data.payerEmail}). Booking ID: ${bookingId}`;

      // Add slot details if available
      if (slotData) {
        const slot = JSON.parse(slotData);
        const dateObj = new Date(slot.parkingDate);
        const formattedDate = dateObj.toLocaleDateString('en-US', {
          weekday: 'short',
          year: 'numeric',
          month: 'short',
          day: 'numeric'
        });
        confirmText += ` Selected Slot: ${slot.selectedSlot}. Date: ${formattedDate}. Time: ${slot.parkingTime}.`;
      }

      document.getElementById("confirmationText").textContent = confirmText;

      // Generate QR code with slot details including booking ID
      let qrData = `Booking:${bookingId}|Parking:${data.lotName}|Amount:${data.amount}|Name:${data.payerName}`;
      if (slotData) {
        const slot = JSON.parse(slotData);
        qrData += `|Slot:${slot.selectedSlot}|Date:${slot.parkingDate}|Time:${slot.parkingTime}`;
      }

      new QRCode(document.getElementById("qrCanvas"), {
        text: qrData,
        width: 200,
        height: 200
      });
    });
  </script>
  <!-- AI Chat Widget -->
  <script src="ai-chat.js"></script>
</body>
</html>
